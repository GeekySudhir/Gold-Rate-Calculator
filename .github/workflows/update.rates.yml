name: Daily Gold Rate Scraper

on:
  schedule:
    # 06:17 UTC = 11:47 AM IST (odd minute avoids standard top-of-hour congestion)
    - cron: '14 18 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated JSON file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add rates.json
          # Only commit if the rates actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update of daily gold rates"
          git push