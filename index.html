<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Calculator & Rate Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 580px;
            border: 2px solid #000000;
            padding: 24px;
            box-sizing: border-box;
            background: #ffffff;
        }

        h1 {
            font-size: 1.35rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            margin: 0 0 16px 0;
            text-align: center;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            border-bottom: 1px solid #000;
            padding-bottom: 8px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .diff-indicator {
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 9px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            border-radius: 0;
        }

        select:focus, input:focus {
            outline: 2px solid #000000;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        #result-section {
            margin-top: 18px;
            border: 1px solid #000000;
            padding: 14px;
            background-color: #fafafa;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .result-row.subtotal {
            border-top: 1px dotted #000000;
            padding-top: 8px;
            margin-top: 8px;
            font-style: italic;
        }

        .result-row.total {
            font-weight: bold;
            font-size: 1.15rem;
            border-top: 2px solid #000000;
            padding-top: 8px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .chart-section {
            margin-top: 24px;
            border-top: 2px solid #000000;
            padding-top: 16px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        canvas {
            width: 100% !important;
            max-height: 220px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Price Calculator & Tracker</h1>

        <div class="meta-bar">
            <span>Date: <span id="display-date">--</span></span>
            <span id="display-diff" class="diff-indicator">Diff: --</span>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="historyDate">Historical Date</label>
                <select id="historyDate" onchange="onDateSelected()">
                    <option value="latest">Latest Recorded</option>
                </select>
            </div>
            <div class="form-group">
                <label for="metalType">Metal / Purity</label>
                <select id="metalType" onchange="onMetalChanged()">
                    <option value="rate_24k">24K Gold</option>
                    <option value="rate_22k" selected>22K Gold</option>
                    <option value="rate_18k">18K Gold</option>
                    <option value="rate_silver">Silver</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="rate">Rate (₹ / gm)</label>
                <input type="number" id="rate" step="0.01" min="0" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label for="weight">Weight (grams)</label>
                <input type="number" id="weight" step="0.01" min="0" value="0" oninput="calculateTotal()">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="making">Making (%)</label>
                <input type="number" id="making" step="0.1" min="0" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label for="gst">GST (%)</label>
                <input type="number" id="gst" step="0.1" min="0" value="3" oninput="calculateTotal()">
            </div>
        </div>

        <!-- Breakdown Section -->
        <div id="result-section">
            <div class="result-row">
                <span>Base Metal Value:</span>
                <span id="res-base">₹0.00</span>
            </div>
            <div class="result-row">
                <span>+ Making Charge:</span>
                <span id="res-making">₹0.00</span>
            </div>
            <div class="result-row subtotal">
                <span>Value Before Tax:</span>
                <span id="res-pretax">₹0.00</span>
            </div>
            <div class="result-row">
                <span>+ GST Amount:</span>
                <span id="res-gst">₹0.00</span>
            </div>
            <div class="result-row total">
                <span>Final Amount:</span>
                <span id="res-total">₹0.00</span>
            </div>
        </div>

        <!-- History Chart Section -->
        <div class="chart-section">
            <div class="chart-header">
                <span>Price Trend</span>
                <span id="chart-metal-label">22K Gold</span>
            </div>
            <canvas id="trendChart"></canvas>
        </div>
    </div>

    <script>
        let fullData = {
            latest: {
                date: "Today",
                rates: { rate_24k: 14850, rate_22k: 13660, rate_18k: 11210, rate_silver: 235 },
                diff: {
                    rate_24k: { amount: 0, percent: 0 },
                    rate_22k: { amount: 0, percent: 0 },
                    rate_18k: { amount: 0, percent: 0 },
                    rate_silver: { amount: 0, percent: 0 }
                }
            },
            history: []
        };

        let chartInstance = null;

        async function init() {
            try {
                const response = await fetch('rates.json?v=' + new Date().getTime());
                if (response.ok) {
                    const loaded = await response.json();
                    if (loaded.latest && loaded.history) {
                        fullData = loaded;
                    }
                }
            } catch (e) {
                console.log("Using local default fallback data.", e);
            }

            populateDateDropdown();
            applySelectedDateRates();
            renderChart();
            calculateTotal();
        }

        function populateDateDropdown() {
            const dropdown = document.getElementById('historyDate');
            dropdown.innerHTML = '';

            const latestOpt = document.createElement('option');
            latestOpt.value = 'latest';
            latestOpt.textContent = `Latest (${fullData.latest.date || 'Today'})`;
            dropdown.appendChild(latestOpt);

            // Populate all past dates in reverse chronological order
            const historyList = [...(fullData.history || [])].reverse();
            historyList.forEach(entry => {
                const opt = document.createElement('option');
                opt.value = entry.date;
                opt.textContent = entry.date;
                dropdown.appendChild(opt);
            });
        }

        function getActiveRecord() {
            const selectedDate = document.getElementById('historyDate').value;
            if (selectedDate === 'latest' || !fullData.history.length) {
                return {
                    date: fullData.latest.date,
                    rates: fullData.latest.rates,
                    diff: fullData.latest.diff
                };
            }
            const found = fullData.history.find(h => h.date === selectedDate);
            return {
                date: found.date,
                rates: {
                    rate_24k: found.rate_24k,
                    rate_22k: found.rate_22k,
                    rate_18k: found.rate_18k,
                    rate_silver: found.rate_silver
                },
                diff: null
            };
        }

        function applySelectedDateRates() {
            const record = getActiveRecord();
            const metal = document.getElementById('metalType').value;
            const currentPrice = record.rates[metal] || 0;

            document.getElementById('rate').value = currentPrice;
            document.getElementById('display-date').textContent = record.date;

            // Diff display
            const diffEl = document.getElementById('display-diff');
            if (record.diff && record.diff[metal]) {
                const d = record.diff[metal];
                const sign = d.amount >= 0 ? '+' : '';
                diffEl.textContent = `Diff: ${sign}₹${d.amount} (${sign}${d.percent}%)`;
            } else {
                diffEl.textContent = 'Diff: --';
            }

            calculateTotal();
        }

        function onDateSelected() {
            applySelectedDateRates();
        }

        function onMetalChanged() {
            applySelectedDateRates();
            updateChart();
        }

        function calculateTotal() {
            const rate = parseFloat(document.getElementById('rate').value) || 0;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const making = parseFloat(document.getElementById('making').value) || 0;
            const gst = parseFloat(document.getElementById('gst').value) || 0;

            const base = rate * weight;
            const makingAmt = (base * making) / 100;
            const preTax = base + makingAmt;
            const gstAmt = (preTax * gst) / 100;
            const total = preTax + gstAmt;

            const format = (n) => '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            document.getElementById('res-base').textContent = format(base);
            document.getElementById('res-making').textContent = format(makingAmt);
            document.getElementById('res-pretax').textContent = format(preTax);
            document.getElementById('res-gst').textContent = format(gstAmt);
            document.getElementById('res-total').textContent = format(total);
        }

        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const metal = document.getElementById('metalType').value;
            const labels = (fullData.history || []).map(h => h.date);
            const dataPoints = (fullData.history || []).map(h => h[metal] || 0);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Today'],
                    datasets: [{
                        label: 'Rate (₹/gm)',
                        data: dataPoints.length ? dataPoints : [fullData.latest.rates[metal]],
                        borderColor: '#000000',
                        backgroundColor: '#000000',
                        fill: false,
                        tension: 0.1,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ` ₹${ctx.parsed.y.toLocaleString('en-IN')}/gm`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#e5e5e5' },
                            ticks: { font: { family: 'Courier New' }, color: '#000000' }
                        },
                        y: {
                            grid: { color: '#e5e5e5' },
                            ticks: {
                                font: { family: 'Courier New' },
                                color: '#000000',
                                callback: (v) => '₹' + v
                            }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!chartInstance) return;
            const metal = document.getElementById('metalType').value;
            const metalLabels = {
                rate_24k: '24K Gold',
                rate_22k: '22K Gold',
                rate_18k: '18K Gold',
                rate_silver: 'Silver'
            };
            document.getElementById('chart-metal-label').textContent = metalLabels[metal];

            const labels = (fullData.history || []).map(h => h.date);
            const dataPoints = (fullData.history || []).map(h => h[metal] || 0);

            chartInstance.data.labels = labels.length ? labels : ['Today'];
            chartInstance.data.datasets[0].data = dataPoints.length ? dataPoints : [fullData.latest.rates[metal]];
            chartInstance.update();
        }

        init();
    </script>
</body>
</html>
